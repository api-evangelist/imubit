aid: imubit
name: Imubit
description: >-
  Imubit is a Houston-based industrial AI company behind the Optimizing Brain, the process
  industry's first Closed Loop AI Optimization (AIO) solution powered by deep reinforcement
  learning. Its cloud-based platform learns a dynamic model from a plant's own historian and
  DCS data, then writes optimal setpoints back through existing control-system infrastructure
  to continuously optimize throughput, yield, energy use and emissions. Imubit reports 100+
  closed-loop applications deployed across refining, oil and gas, chemicals, petrochemicals and
  polymers, cement and building materials, and mining, minerals and metals, and is trusted by
  7 of the 10 largest U.S. refiners. Imubit publishes no public developer API; its GitHub
  organization ships open-source Python libraries for pulling data from industrial historians
  (OSIsoft PI, Aspen IP21) and supporting infrastructure.
